name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    name: Build, format check, test (PostgreSQL via Testcontainers), coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore ClaimsEngine.sln

      - name: Formatting must be clean
        run: dotnet format ClaimsEngine.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build ClaimsEngine.sln -c Release --no-restore

      # Coverage is collected by coverlet.msbuild and gated per test project
      # (Domain >= 95%, Application >= 90%, Api+Infrastructure >= 85%, line and branch).
      # API tests run against real PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Test with coverage gates
        run: >
          dotnet test ClaimsEngine.sln -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          -reports:"tests/**/TestResults/coverage/coverage.cobertura.xml"
          -targetdir:TestResults/coverage-report
          -reporttypes:"HtmlInline;MarkdownSummaryGithub"

      - name: Coverage summary
        if: always()
        run: cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report

  docker:
    name: Docker build (tests run inside) + Trivy scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t dotnet-claims-engine:ci .

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dotnet-claims-engine:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
